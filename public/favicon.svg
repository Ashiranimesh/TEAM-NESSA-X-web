<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Badge background with border for crisp visibility on both dark and light browser tabs -->
  <circle cx="32" cy="32" r="31" fill="#FFF1E8" stroke="#792D40" stroke-width="2"/>
  
  <g id="tikirilia-avatar">
    <!-- Hair Bun -->
    <circle cx="45" cy="18" r="9" fill="#F3C65B" />
    
    <!-- Hair Base -->
    <circle cx="32" cy="30" r="19" fill="#F3C65B" />
    
    <!-- Traditional Dress Collar -->
    <path d="M14 62c2-14 11-20 23-20s21 6 23 20z" fill="#792D40" />
    <path d="M21 62c3-9 9-13 16-13s13 4 16 13" fill="none" stroke="#F3C65B" stroke-width="2" stroke-linecap="round" />
    
    <!-- Face -->
    <circle cx="32" cy="34" r="16" fill="#FFDCC8" />
    
    <!-- Front Hair Bangs -->
    <path d="M17 29c4-9 12-12 20-8 5 2 8 5 11 9-8-2-18-4-31-1z" fill="#F3C65B" />
    
    <!-- Rosy Cheeks -->
    <circle cx="23" cy="38" r="3.2" fill="#f6a5b0" opacity="0.9" />
    <circle cx="41" cy="38" r="3.2" fill="#f6a5b0" opacity="0.9" />
    
    <!-- Happy Eyes with Highlights -->
    <ellipse cx="25" cy="33" rx="2.2" ry="2.8" fill="#2a1520" />
    <ellipse cx="39" cy="33" rx="2.2" ry="2.8" fill="#2a1520" />
    <circle cx="26" cy="32" r="0.9" fill="#ffffff" />
    <circle cx="40" cy="32" r="0.9" fill="#ffffff" />
    
    <!-- Smile -->
    <path d="M28 40q4 4 8 0" fill="none" stroke="#792D40" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Traditional Frangipani / Araliya Flower in Hair -->
    <g transform="translate(45 23) scale(0.38)">
      <g fill="#ffffff" stroke="#F3C65B" stroke-width="1.8">
        <ellipse cx="0" cy="-11" rx="6" ry="11" />
        <ellipse cx="0" cy="-11" rx="6" ry="11" transform="rotate(72)" />
        <ellipse cx="0" cy="-11" rx="6" ry="11" transform="rotate(144)" />
        <ellipse cx="0" cy="-11" rx="6" ry="11" transform="rotate(216)" />
        <ellipse cx="0" cy="-11" rx="6" ry="11" transform="rotate(288)" />
      </g>
      <circle r="4.5" fill="#F3C65B" />
    </g>
  </g>
</svg>
